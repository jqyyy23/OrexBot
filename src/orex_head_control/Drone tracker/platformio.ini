; PlatformIO Project Configuration File
; OrexBot – Head Tracking Firmware (ESP32-S3, micro-ROS Jazzy, WiFi)
;
; https://docs.platformio.org/page/projectconf.html

; Redirect build output AND libdeps to a space-free path.
; micro-ROS colcon scripts (setup.sh) break when the project path
; contains spaces (e.g. "Head control/Drone tracker").
[platformio]
build_dir    = /home/jay/github/OrexBot/build/drone_tracker
libdeps_dir  = /home/jay/github/OrexBot/build/drone_tracker/libdeps

[env:esp32-s3-devkitc-1]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
board_microros_distro = jazzy
board_microros_transport = serial
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.flash_mode          = qio
board_build.arduino.memory_type = qio_opi   ; 8 MB Octal PSRAM
board_build.psram_type          = opi
board_build.f_cpu               = 240000000L   ; ESP32-S3 CPU clock (was invalid "esp32s3")

; ── Serial monitor ────────────────────────────────────────────
monitor_speed   = 115200
